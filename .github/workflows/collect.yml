name: Collect Artist Data

on:
  schedule:
    - cron: '17 14 * * *' # UTC 14:17 = JST 23:17（端数の分で混雑回避。GitHub側の遅延で数時間ずれる可能性あり）
  workflow_dispatch: # 手動実行用
    inputs:
      artist_id:
        description: '特定のアーティストIDのみ収集する (空なら全件)'
        required: false
        default: ''
      date:
        description: '記録する日付を指定 (YYYY-MM-DD、空なら当日UTC)'
        required: false
        default: ''

env:
  GIT_AUTHOR_NAME: Kosuke Ito
  GIT_AUTHOR_EMAIL: 32892023+Kosuke-Ito@users.noreply.github.com
  GIT_COMMITTER_NAME: Kosuke Ito
  GIT_COMMITTER_EMAIL: 32892023+Kosuke-Ito@users.noreply.github.com

permissions:
  contents: read # data は別リポジトリへ Deploy Key で push するため、このリポジトリへの書き込みは不要

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # データは Private リポジトリ（music-analytics-data）で管理。data/ にチェックアウトする
      - uses: actions/checkout@v7
        with:
          repository: Kosuke-Ito/music-analytics-data
          path: data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - name: Record data HEAD before run
        id: before
        run: echo "sha=$(git -C data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run collector
        timeout-minutes: 28
        run: |
          ARGS=""
          if [ -n "${{ inputs.artist_id }}" ]; then
            ARGS="$ARGS --artist-id ${{ inputs.artist_id }}"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          python -m collector.main $ARGS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Commit and push data
        working-directory: data
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily listener data"
          # 並行コミットで push が rejected されたら rebase してリトライ（最大3回）
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), pulling with rebase..."
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts"
          exit 1

      # data に新しいコミットがあれば Cloudflare Pages を再ビルドする（コード側の push が無いと自動デプロイされないため）
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          AFTER_SHA=$(git -C data rev-parse HEAD)
          if [ "$AFTER_SHA" = "$BEFORE_SHA" ]; then
            echo "No new data commits; skip deploy"
            exit 0
          fi
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not set; skip deploy"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "Deploy triggered"
