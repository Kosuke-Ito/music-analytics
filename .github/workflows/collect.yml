name: Collect Artist Data

on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = JST 09:00
  workflow_dispatch: # 手動実行用
    inputs:
      artist_id:
        description: '特定のアーティストIDのみ収集する (空なら全件)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run collector
        run: |
          if [ -n "${{ inputs.artist_id }}" ]; then
            python -m collector.main --artist-id "${{ inputs.artist_id }}"
          else
            python -m collector.main
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update daily listener data"
          git push
