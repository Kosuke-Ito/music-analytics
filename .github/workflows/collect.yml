name: Collect Artist Data

on:
  schedule:
    - cron: '0 14 * * *' # UTC 14:00 = JST 23:00
  workflow_dispatch: # 手動実行用
    inputs:
      artist_id:
        description: '特定のアーティストIDのみ収集する (空なら全件)'
        required: false
        default: ''
      date:
        description: '記録する日付を指定 (YYYY-MM-DD、空なら当日UTC)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run collector
        timeout-minutes: 20
        run: |
          ARGS=""
          if [ -n "${{ inputs.artist_id }}" ]; then
            ARGS="$ARGS --artist-id ${{ inputs.artist_id }}"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          python -m collector.main $ARGS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily listener data"
          # 並行コミットで push が rejected されたら rebase してリトライ（最大3回）
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), pulling with rebase..."
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts"
          exit 1
