name: Collect News Annotations

on:
  schedule:
    - cron: '0 1 * * *' # 毎日 UTC 01:00（JST 10:00、データ収集の1時間後）
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            あなたは音楽ニュースリサーチャーです。
            scripts/config.json のアーティスト一覧を読み、各アーティストについて
            前日（昨日）の話題やニュースをWeb検索してください。

            検索ソース:
            - X（Twitter）での話題・トレンド
            - 音楽メディア（natalie.mu, Billboard Japan, Oricon, Billboard, Pitchfork等）
            - エンタメニュース（Yahoo!ニュース, Google News等）
            - YouTube公式チャンネルの新着動画

            検索キーワード例:
            - 「{アーティスト名} 新曲」「{アーティスト名} MV」
            - 「{artist name} new release」「{artist name} tour」
            - 「{アーティスト名} site:x.com」

            見つけたニュースは data/{artist_id}.json の annotations 配列に追加してください。

            アノテーションの形式:
            {
              "date": "YYYY-MM-DD",
              "title": "簡潔なタイトル（日本語）",
              "description": "詳細説明（1-2文）",
              "url": "ソースURL",
              "category": "release|viral|collab|tour|award|other",
              "added_at": "現在のISO 8601タイムスタンプ"
            }

            ★★★ dateフィールドについて（最重要）★★★
            - dateはイベントが「実際に起きた日付」を正確に入れること
            - 楽曲リリース → 配信開始日（SpotifyやApple Musicでの配信開始日）
            - MV公開 → YouTubeにアップロードされた日
            - ライブ/フェス出演 → 実際の公演日
            - 受賞 → 授賞式の日
            - ニュース記事の公開日ではなく、出来事そのものの日付を使う
            - 日付が不明確な場合は、複数のソースを照合して正確な日付を特定する
            - どうしても日付が特定できない場合はそのニュースをスキップする
            - ★未来の日付は絶対に使わない★ まだ起きていない予定・リリース予告は追加しない。実際に起きた過去のイベントのみ対象

            その他のルール:
            - 同日+同タイトルの重複は追加しない
            - annotations配列は日付順にソートする
            - annotationsキーが無い場合は作成する
            - 新曲/アルバムリリース、MV公開、SNSでバズった話題、コラボ発表、ツアー発表、受賞、テレビ出演、ストリーミング記録達成など幅広く拾う
            - ニュースが見つからないアーティストはスキップしてOK
            - 全アーティスト検索後、変更があれば git add data/ && git commit -m "chore: add news annotations" && git push を実行する
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "WebSearch",
                  "WebFetch",
                  "Read",
                  "Write",
                  "Edit",
                  "Bash(git *)"
                ]
              }
            }
