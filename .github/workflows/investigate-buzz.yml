name: Investigate Organic Buzz

on:
  workflow_run:
    workflows: [Collect News Annotations]
    types: [completed]
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: Kosuke Ito
  GIT_AUTHOR_EMAIL: 32892023+Kosuke-Ito@users.noreply.github.com
  GIT_COMMITTER_NAME: Kosuke Ito
  GIT_COMMITTER_EMAIL: 32892023+Kosuke-Ito@users.noreply.github.com

permissions:
  contents: read # data は別リポジトリへ Deploy Key で push するため、このリポジトリへの書き込みは不要
  id-token: write

jobs:
  investigate:
    # ニュース収集が成功した後にのみ実行（手動起動は常に許可）
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # データは Private リポジトリ（music-analytics-data）で管理。data/ にチェックアウトする
      - uses: actions/checkout@v7
        with:
          repository: Kosuke-Ito/music-analytics-data
          path: data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - name: Record data HEAD before run
        id: before
        run: echo "sha=$(git -C data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            あなたは音楽業界のバズ原因調査員です。

            ## タスク

            data/*.json の buzz_events を確認し、以下の条件に合うバズイベントを探してください:
            - type が "organic"（自然発生 = 原因不明のバズ）
            - scripts/config.json で region が "jp" のアーティスト

            該当するアーティストが見つかった場合、**なぜ突然数値が伸びているか**を調査してください。

            ## 調査方法

            1. Web検索で原因を探る:
               - 「{アーティスト名} バズ」「{アーティスト名} TikTok」「{アーティスト名} 話題」
               - 「{アーティスト名} site:natalie.mu」「{アーティスト名} site:oricon.co.jp」
               - 「{アーティスト名} テレビ出演」「{アーティスト名} CM」「{アーティスト名} プレイリスト」

            2. 原因の候補:
               - TikTok / YouTube ショートでの楽曲使用（UGC バイラル）
               - テレビ番組・CM でのタイアップ
               - Spotify / Apple Music の公式プレイリスト掲載
               - コラボレーション・フィーチャリング
               - ライブ・フェス出演後の注目
               - SNS でのバズ（インフルエンサー等）
               - 海外メディアでの紹介

            3. 結果をアノテーションとして追記:
               - date: バズが検出された日付（buzz_event の date）
               - title: 原因の簡潔な説明
               - description: 詳細（「TikTokで〇〇の動画がバズり、楽曲△△が拡散。再生数XX万回。」等）
               - category: 原因に応じて（viral / collab / other 等）
               - source: 調査に使ったソース
               - confidence: high（複数ソースで確認）/ medium（単一ソース）/ low（推測）

            4. 原因が特定できない場合:
               - title: "数値上の異常上昇を検知（原因不明）"
               - description: "Spotify月間リスナーが通常の〇倍に急増。原因を特定できず。"
               - category: "other"
               - confidence: "low"

            ## ルール

            - organic バズが無ければ何もしない（コミットも不要）
            - 既にアノテーションがある日付+タイトルの重複は追加しない
            - annotations 配列は日付順にソート
            - ★★★ data/*.json を編集した後、コミット前に必ず編集したファイルを Read で読み直して JSON として正しいか確認すること ★★★
              特に annotations 配列の要素間にカンマ `,` があるか注意。壊れていたら修正してからコミットすること
            - **data/ は別リポジトリ（music-analytics-data）のチェックアウトなので、git 操作は必ず `git -C data ...` の形で行う**（`cd` は使わない）
            - 変更があれば `git -C data add -A && git -C data commit -m "chore: investigate organic buzz" && git -C data push` を実行する
            - push が rejected されたら `git -C data pull --rebase origin main` してから再度 `git -C data push` を試行する（最大3回）
            - このリポジトリ（ルート側）には何もコミットしない
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "WebSearch",
                  "WebFetch",
                  "Read",
                  "Write",
                  "Edit",
                  "Bash(git *)"
                ]
              }
            }

      # data に新しいコミットがあれば Cloudflare Pages を再ビルドする（コード側の push が無いと自動デプロイされないため）
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          AFTER_SHA=$(git -C data rev-parse HEAD)
          if [ "$AFTER_SHA" = "$BEFORE_SHA" ]; then
            echo "No new data commits; skip deploy"
            exit 0
          fi
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not set; skip deploy"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "Deploy triggered"
